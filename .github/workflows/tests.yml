name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mail and Claude are faked in the tests; the Claude Agent SDK is only imported when a real reply is generated.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (no API key or account needed)
        run: pytest -v
